# ─────────────────────────────────────────────────────────
#  Astra Local Agent — Docker Compose
#
#  Orchestrates:
#    1. astra     — The agent (Node.js + SQLite + tools)
#    2. ollama    — Local LLM inference server
#
#  Host Mac Mini only exposes:
#    - ./data/       → Persistent SQLite DB + credentials
#    - ./knowledge/  → Markdown RAG files (editable on host)
# ─────────────────────────────────────────────────────────

services:
  # ─── Ollama (Local LLM) ─────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: astra-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      # Persist downloaded models across container restarts
      - ollama_models:/root/.ollama
    # Apple Silicon GPU passthrough (Docker Desktop for Mac)
    deploy:
      resources:
        reservations:
          memory: 8G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ─── Astra Agent ────────────────────────────────────────
  astra:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astra-agent
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Override Ollama URL to point to the sibling container
      - OLLAMA_BASE_URL=http://ollama:11434
      - DB_PATH=/app/data/memory.db
      - SERVICE_ACCOUNT_PATH=/app/data/service_account.json
      - NODE_ENV=production
    volumes:
      # Persistent data: SQLite DB + Google credentials
      # Mounted read-write so the agent can write to the DB
      - ./data:/app/data

      # Knowledge base: Markdown files for RAG
      # Mounted read-only — edit on the host, agent only reads
      - ./knowledge:/app/knowledge:ro

      # Skills: OpenClaw instruction files
      # Mounted read-only — edit on the host
      - ./skills:/app/skills:ro
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('better-sqlite3')('/app/data/memory.db').pragma('journal_mode')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── Astra Dashboard ──────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astra-dashboard
    restart: unless-stopped
    command: ["npm", "run", "start:services"]
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/memory.db
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./data:/app/data
      - ./services/dashboard.html:/app/services/dashboard.html:ro
    ports:
      - "3001:3001"
    depends_on:
      - astra

  # ─── Immich Photo Server ──────────────────────────────────
  immich-server:
    image: ghcr.io/immich-app/immich-server:release
    container_name: immich-server
    restart: unless-stopped
    volumes:
      - /Volumes/Extreme SSD/immich/library:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    env_file: .env.immich
    depends_on:
      - immich-postgres
      - immich-redis
    ports:
      - "0.0.0.0:2283:2283"

  immich-ml:
    image: ghcr.io/immich-app/immich-machine-learning:release
    container_name: immich-ml
    restart: unless-stopped
    volumes:
      - immich_ml_cache:/cache
    env_file: .env.immich

  immich-postgres:
    image: tensorchord/pgvecto-rs:pg16-v0.3.0
    container_name: immich-postgres
    restart: unless-stopped
    volumes:
      - immich_pgdata:/var/lib/postgresql/data
    env_file: .env.immich

  immich-redis:
    image: redis:7-alpine
    container_name: immich-redis
    restart: unless-stopped


volumes:
  ollama_models:
    name: astra-ollama-models
  immich_ml_cache:
    name: astra-immich-ml-cache
  immich_pgdata:
    name: astra-immich-pgdata
