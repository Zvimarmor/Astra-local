# ─────────────────────────────────────────────────────────
#  Immich Photo Server — Dedicated Compose File
# ─────────────────────────────────────────────────────────

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:release
    container_name: immich-server
    restart: unless-stopped
    volumes:
      - "/Volumes/Extreme SSD/immich/library:/usr/src/app/upload"
      - /etc/localtime:/etc/localtime:ro
    env_file: .env.immich
    depends_on:
      - immich-postgres
      - immich-redis
    ports:
      - "0.0.0.0:2283:2283"

  immich-ml:
    image: ghcr.io/immich-app/immich-machine-learning:release
    container_name: immich-ml
    restart: unless-stopped
    volumes:
      - immich_ml_cache:/cache
    env_file: .env.immich

  immich-postgres:
    image: tensorchord/pgvecto-rs:pg16-v0.3.0
    container_name: immich-postgres
    restart: unless-stopped
    volumes:
      - "/Volumes/Extreme SSD/immich/postgres:/var/lib/postgresql/data"
    env_file: .env.immich

  immich-redis:
    image: redis:7-alpine
    container_name: immich-redis
    restart: unless-stopped

volumes:
  immich_ml_cache:
    name: astra-immich-ml-cache
