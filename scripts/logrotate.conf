# ─── Astra Log Rotation (newsyslog) ──────────────────────────────
#
# Install: sudo cp scripts/logrotate.conf /etc/newsyslog.d/astra.conf
#
# Format: logfile                                          [owner:group] mode count size(KB) when  flags [/pid_file] [sig_num]
#
# Rotates at 5MB, keeps 5 archives, compresses old logs.
# Replace YOUR_USERNAME with your actual macOS username.

/Users/YOUR_USERNAME/MyProjects/Astra/data/astra.log                  644  5     5120     *     GJ
/Users/YOUR_USERNAME/MyProjects/Astra/data/astra-error.log            644  5     5120     *     GJ
/Users/YOUR_USERNAME/MyProjects/Astra/data/whatsapp-listener.log      644  5     5120     *     GJ
/Users/YOUR_USERNAME/MyProjects/Astra/data/whatsapp-listener-error.log 644  5    5120     *     GJ
/Users/YOUR_USERNAME/MyProjects/Astra/data/dashboard.log              644  3     5120     *     GJ
/Users/YOUR_USERNAME/MyProjects/Astra/data/dashboard-error.log        644  3     5120     *     GJ
